name: Triage CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: triage_user
          POSTGRES_PASSWORD: triage_password
          POSTGRES_DB: triage_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Linter
        run: npm run lint

      - name: Run Comprehensive Test Suite
        env:
          DATABASE_URL: postgres://triage_user:triage_password@localhost:5432/triage_db
        run: npm test

      - name: Run End-to-End Clinical Verification
        run: npm run verify

      - name: Test Database Seeding Script
        env:
          DATABASE_URL: postgres://triage_user:triage_password@localhost:5432/triage_db
        run: npm run seed:db

      - name: Build Next.js Production Assets
        env:
          DATABASE_URL: postgres://triage_user:triage_password@localhost:5432/triage_db
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
