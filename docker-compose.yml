version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:18-alpine
    container_name: triage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: triage_user
      POSTGRES_PASSWORD: triage_password
      POSTGRES_DB: triage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage_user -d triage_db || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Triage Next.js Application Service
  triage-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triage_app_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgres://triage_user:triage_password@postgres:5432/triage_db
    volumes:
      # Dual persistence: WAL file log on disk + PostgreSQL database volume
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/queue || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
